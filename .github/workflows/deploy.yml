name: Deploy Next.js to cPanel Shared Hosting

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: cpanel-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy via FTP (Disk-Safe)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Next.js Application
        run: npm run build

      - name: 🧹 Clean Build Cache & Source Maps (Save Shared Hosting Disk)
        run: |
          rm -rf .next/cache
          find .next -name "*.map" -type f -delete
          du -sh .next public

      - name: 🛠️ Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: 🚀 Sync Runtime Files & Clean Old .next Chunks on cPanel
        env:
          FTP_HOST: ${{ secrets.CPANEL_SERVER }}
          FTP_USER: ${{ secrets.CPANEL_USERNAME }}
          FTP_PASS: ${{ secrets.CPANEL_PASSWORD }}
        run: |
          mkdir -p tmp
          date -u +"%Y-%m-%dT%H:%M:%SZ" > tmp/restart.txt

          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'SCRIPT'
            set ftp:ssl-allow no
            set ftp:passive-mode on
            set ftp:use-mdtm off
            set ftp:use-site-utime off
            set ftp:use-site-idle off
            set ftp:use-pret off
            set net:max-retries 10
            set net:reconnect-interval-base 5
            set net:reconnect-interval-max 60
            set net:timeout 40
            set mirror:use-utc off

            # 1. Sync .next WITH --delete so stale build chunks never fill up shared hosting disk/inodes
            mirror -R --delete --parallel=4 --no-perms --no-umask --continue --verbose=1 \
              --exclude '^cache/' \
              --exclude '\.map$' \
              .next helmisalsabila/.next

            # 2. Sync public assets WITHOUT --delete (protects user-uploaded files in public/uploads/)
            mirror -R --parallel=4 --no-perms --no-umask --continue --verbose=1 \
              --exclude '^uploads/' \
              public helmisalsabila/public

            # 3. Upload essential root runtime files only (skips src/, docs/, *.zip, *.sql, *.md)
            put -O helmisalsabila/ app.js
            put -O helmisalsabila/ next.config.js
            put -O helmisalsabila/ package.json
            put -O helmisalsabila/ package-lock.json

            # 4. Trigger Phusion Passenger restart STRICTLY LAST after all .next/static chunks exist
            mkdir -p helmisalsabila/tmp
            put -O helmisalsabila/tmp/ tmp/restart.txt
            bye
          SCRIPT

      - name: ✅ Verify Website & CSS Asset Are Up
        run: |
          sleep 8
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://helsenvi.com/api/health)
          echo "HTTP status from https://helsenvi.com/api/health => $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Site healthcheck returned $code (Passenger may still be restarting)."
          fi
